# Setiap perubahan kode dijalankan ulang dan dicocokkan dengan angka
# yang tercetak di buku (keluaran/babNN.txt).
name: periksa keluaran

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  periksa:
    # Angka buku dihasilkan di macOS arm64 dengan Python 3.13.5 dan NumPy/SciPy
    # ber-OpenBLAS. Lingkungan yang sama dipasang di sini: pengurutan (urutan
    # kata berhitungan sama) dan BLAS (digit terakhir) bergantung pada jenis
    # CPU dan pustaka aljabar linear, sehingga di mesin lain digit terakhir
    # sebagian angka dapat berbeda.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: NumPy dan SciPy varian OpenBLAS
        run: |
          pip download --no-deps --only-binary=:all: --python-version 3.13 \
            --platform macosx_12_0_arm64 numpy==2.1.3 scipy==1.15.3 -d whl
          pip install whl/*.whl
      - run: pip install -r requirements.txt
      - run: python -c "import numpy, scipy; numpy.show_config(); scipy.show_config()"
      - run: python periksa.py
